name: Discover boards

on:
  schedule:
    - cron: "17 15 * * 0"  # Sunday 8:47 pm IST
  workflow_dispatch:

concurrency:
  group: discover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - run: npm ci

      - name: Find new job boards
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run discover
